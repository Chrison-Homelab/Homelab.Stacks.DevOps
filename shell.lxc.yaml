# Shell host — a long-lived tmux server you attach to instead of keeping shells
# on each laptop (#404).
#
#   ssh shell.devops.chrison.internal -t tmux new -A -s main
#
# NAMING. Deliberately `devops.chrison.internal`, NOT `shell.homelab.chrison.internal`
# — the stack gets its own internal subdomain, following the precedent set when Home
# Assistant moved to `homeassistant.iot.chrison.internal` rather than nesting under
# homelab. The name then says which STACK owns the box, not which VLAN it happens to
# sit on, so a re-VLAN or the move to the powernode does not rename anything. It is
# also the shape the external surface will take for this stack (*.devops.chrison.dev).
#
# This is a per-host UniFi local DNS record on the reservation, not a per-network
# domain: VLAN 1010's domain is `homelab.chrison.internal` and every other member of
# this stack still answers there. Both names resolving is fine — the record is
# additive.
#
# NODE CHOICE — desktop-01, and not as a stopgap. Three reasons that all point the
# same way: it is the most capable machine in the fleet (Ryzen 5 3600 / 12 threads /
# 2 TB NVMe) against hpe-01's i5-6500T and nuc-01's i3-4010U; this is where the WORK
# happens, so builds want the cores; and the DevOps stack's default node is already
# desktop-01, so the shell host sits with the forge and the runners it drives rather
# than reaching across nodes to them.
#
# The milestone originally specced hpe-01, on the grounds that desktop-01 is the
# on-demand sleep target (#191) and a session dialled into unpredictably would block
# evacuation. That trade-off is real but it resolves the other way: the sleep target
# is the machine we can afford to keep awake, not the machine worth crippling.
#
# Moving it stays a one-line `node:` edit plus a converge — nothing below is
# node-specific — so the always-on powernode remains an easy future home. It is no
# longer the reason this CT is here.
#
# ⚠ While it lives here, desktop-01 must not be armed for sleep: PR3 of #191 is
#   gated on evacuation, and this CT is exactly the workload that cannot be
#   evacuated silently.
#
# app: debian → ct/debian.sh creates a plain base CT; the `shell` provisioner then
# installs tmux + the CLI kit, renders the canonical ~/.tmux.conf and the rio
# terminfo from shell-assets/ (#405), installs the TPM plugins, and enables a
# systemd unit that brings the session back after a reboot (#408). Validate against
# ../../Infrastructure/schema/shape.schema.json.

apiVersion: homelab/v1
kind: LXC

metadata:
  name: shell
  stack: DevOps
  tags: [shell, tmux, dev]

spec:
  app: debian           # plain base CT (ct/debian.sh) — no community-scripts app to install
  provisioner: shell    # post-create dispatched to ShellProvisioner
  ctid: 3003            # the gap between github-runner (3002) and cloudflared (3004)
  # ── Resources. This is the one CT on the fleet whose job is to be worked IN, so it
  #    gets the largest slice of desktop-01 rather than a polite one.
  cores: 8              # of desktop-01's 12 threads. CPU is the cheap axis to be generous on:
                        # the LXC `cores` value is a scheduling weight, not a reservation, so
                        # the other guests are not starved when this one is idle — and a
                        # `dotnet build` here was measured at ~2x the laptop's wall-clock on 4.
  memory: 8192          # MB — 6144 → 8192. Claude Code documents 4 GB as its MINIMUM, so half
                        # the previous allocation was floor, with dotnet builds, a language
                        # server and tmux/zellij panes competing for the rest.
                        #
                        # ⚠ THIS IS THE AXIS THAT IS ACTUALLY CONSTRAINED, and it is a node
                        #   property, not a shape one. desktop-01 has 16 GB physical; declared
                        #   guest memory across its running CTs is now ~25 GB, i.e. ~1.6x
                        #   overcommitted. That is fine because LXC memory is a cap rather
                        #   than a reservation (live usage sits near 3 GB), but the peak case
                        #   — a full CI run on 3001+3002 while this host builds — is close to
                        #   physical + swap. Do not raise this further without adding RAM to
                        #   the node: it has 4 DIMM slots, 2 populated, DDR4-2400, 128 GB max.
  swap: 2048            # MB — 512 → 2048. Elasticity for the cap above, so a transient spike
                        # in one build reaches for swap instead of the OOM killer. The node
                        # has 8 GB of swap and currently uses none of it.
  disk: 500             # GB — 32 → 500. Deliberately generous: checkouts, two toolchains
                        # (apt + brew), NuGet/npm caches, build outputs, and whatever an agent
                        # decides to fetch. desktop-01's local-lvm is a 2 TB Samsung 970 EVO
                        # Plus, so this is fast space and there is plenty of it.
                        #
                        # It costs nothing up front. local-lvm is LVM-THIN, so `size=500G` is a
                        # virtual ceiling and the pool only consumes what is actually written —
                        # growing this from 64 G moved the pool's Data% not at all (17.78% before
                        # and after). Even the fully-written worst case fits: declared virtual
                        # size across every volume on the pool is now ~1174 GiB against a
                        # 1710 GiB pool, i.e. still UNDER-provisioned, not overcommitted.
                        #
                        # ⚠ ONE-WAY. LVM-thin cannot shrink a mounted rootfs, so lowering this
                        #   number later is a rebuild, not an edit. It is a commitment, which is
                        #   why the arithmetic above is written down rather than assumed.
                        #
                        # ⚠ The blast radius of filling it is the POOL, not this CT. A thin pool
                        #   at 100% takes every guest on local-lvm read-only, and desktop-01's VG
                        #   has only ~16 GiB unallocated so the pool cannot be extended out of
                        #   trouble. `df` inside here now reads 492 G, and nothing gives an agent
                        #   backpressure before that. Watch pool usage (Pulse, CT 4000), not this
                        #   filesystem.

  # node/os/network/storage/timezone/onboot inherited from the DevOps stack
  # (node: desktop-01, VLAN 1010, DHCP).
  #
  # DHCP + a UniFi reservation, like the other DevOps members. The reservation pins the
  # address AND carries the `shell.devops.chrison.internal` local DNS record (see NAMING
  # above) — that name is the whole point of the shape, and without it the SSH target
  # moves on the next lease. Declared below rather than reserved by hand: converge reads
  # net0's live MAC after create and reconciles the controller entry (superproject #416).
  network:
    reservation:
      fixedIp: 10.10.135.221
      localDnsRecord: shell.devops.chrison.internal

  # ── TRIM. This host CHURNS: clone a large repo, fan out git worktrees, throw them away,
  #    repeat. Without discard, every block freed inside the guest stays allocated to its
  #    thin volume forever, so the CT creeps toward its 500 G ceiling no matter what `df`
  #    reports inside it — and the blast radius of exhausting a shared LVM-thin pool is
  #    EVERY guest on it going read-only, not just this one.
  #
  #    Inline (`discard`) rather than a periodic fstrim, deliberately: it keeps the reclaim
  #    window at zero, needs no node-level timer to survive a rebuild or the eventual move
  #    to the powernode, and travels with the shape. The whole chain is in place for it —
  #    the pool is `Discards: passdown` and the 970 EVO Plus advertises discard.
  #
  #    Verified by churning 20 GiB through it (LV data% / pool data%):
  #      baseline 2.08 / 18.02 → after writing 20 GiB 6.12 / 19.20 → after rm 2.18 / 18.05
  #    i.e. reclaimed automatically, with no fstrim run at all.
  #
  # ⚠ THIS BLOCK IS CURRENTLY DECORATIVE — see superproject #480. `spec.rootfsOptions` is in
  #   the schema and is parsed and inherited, but nothing in the engine ever reads it, so
  #   validate passes, converge reports no drift, and the option never reaches the CT. It is
  #   declared here as the record of intent; the live setting was applied by hand:
  #       pct set 3003 --rootfs local-lvm:vm-3003-disk-0,size=500G,mountoptions=discard
  #       pct reboot 3003          # mountoptions only take effect at container start
  #   Confirm with `pct exec 3003 -- findmnt -n -o OPTIONS /` → expect `discard` in the list.
  rootfsOptions:
    mountoptions: discard

  # Deliberately NO `features: nesting` — this is a terminal, not a container host.
  # Add it when something here actually needs to run Docker, not in advance.

  config:
    user: csimon                 # login user; the tmux server runs as this account
    session: main                # `tmux new -A -s main` — the session the unit starts at boot
    assets: shell-assets         # sibling dir: tmux.conf + rio.terminfo, rendered into the CT

    # Public keys allowed to log in as `user`. Public halves only — nothing secret,
    # which is why this is config and not a `secrets:` entry.
    authorizedKeys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKpaKcbRzOJqGnC/iPyKp3ZD+10aTjrBkvjv0YACIFA1 csimon@mac"

    # Beyond the provisioner's baseline (tmux, git, curl, ca-certificates,
    # ncurses-bin for tic, ncurses-term for the tmux-256color entry).
    # ── Toolchain (#421). This stops being just a terminal and becomes a place to work.
    homebrew: true              # Linuxbrew at /home/linuxbrew/.linuxbrew, driven by the
                                # Brewfile in shell-assets/ so it stays declarative.
                                # NOTE tmux is deliberately NOT in the Brewfile — brew's bin
                                # comes first on PATH and tmux's client/server must match
                                # versions, so a brew tmux would break `tmux attach` against
                                # the apt-started server. See the Brewfile's own note.
    claudeCode: true            # from Anthropic's signed apt repo. It is a Homebrew CASK, and
                                # casks are macOS-only, so brew cannot install it here.
                                # ⚠ Login is INTERACTIVE and one-time: run `claude` and follow
                                #   the browser prompts. Converge installs it, not signs in.

    # apt packages beyond the provisioner's baseline. Most day-to-day tools now come from the
    # Brewfile instead; these are the ones that belong to the system rather than the toolchain.
    packages:
      - unzip
      - rsync
      - vim
