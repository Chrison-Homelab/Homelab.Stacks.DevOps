# tmux.conf — the CANONICAL tmux config for the homelab shell host (#405).
#
# tmux config is read by the SERVER process, so once the server lives on CT 3003
# this file is the only copy that matters. Laptops need Rio + the Nerd Font and
# nothing else; there is no per-laptop tmux config left to drift.
#
# Derived from the laptop's ~/.tmux.conf with the macOS-only bits removed —
# see the DIVERGENCE notes below. Rendered to ~/.tmux.conf by the `shell`
# provisioner; edit it here, not on the host, or the next converge overwrites it.

# --- basics ---------------------------------------------------------------
# DIVERGENCE: the laptop config opens with a run-shell that puts /opt/homebrew/bin
# ahead of /usr/bin, because macOS ships bash 3.2 (no `declare -A`) and the theme
# plugin's palette collapses to a single unreadable colour under it. Debian's
# /bin/bash is 5.x, so the shim is dropped rather than carried as a no-op.

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
# OSC 52. On a headless host this is what carries a yank back to the laptop's
# clipboard — there is no pasteboard here for tmux-yank to write into, so the
# copy has to travel over the terminal itself.
set -g set-clipboard on
set -g default-terminal "tmux-256color"
# Needs the ncurses-term package for the tmux-256color entry — the base Debian
# ncurses-base does not carry it, and without it tmux falls back to screen.
#
# rio's terminfo only advertises colors#256 with no Tc/RGB flag, so tmux would
# fall back to 256-colour approximation without this override.
set -ga terminal-overrides ",*256col*:Tc,alacritty:Tc,rio:RGB,rio:Tc"

# Claude Code inside tmux: let modified keys (Shift+Enter) through, and let
# notifications/progress reach the outer terminal.
# NB: the documented pattern is 'xterm*:extkeys', which does NOT match TERM=rio
# — hence the explicit rio entry.
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys,rio:extkeys'

# new windows keep the current directory (splits are pain-control's job)
bind c new-window -c "#{pane_current_path}"

# reload
bind r source-file ~/.tmux.conf \; display "config reloaded"

# --- plugins --------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'    # | - splits, hjkl select, HJKL resize
set -g @plugin 'tmux-plugins/tmux-logging'         # prefix+P toggle log, prefix+alt-p screencap
set -g @plugin 'tmux-plugins/tmux-resurrect'       # prefix + Ctrl-s save / Ctrl-r restore
set -g @plugin 'tmux-plugins/tmux-continuum'       # ...and do it automatically
set -g @plugin 'tmux-plugins/tmux-cpu'             # #{cpu_percentage} #{ram_percentage}
set -g @plugin 'tmux-plugins/tmux-sidebar'         # prefix + Tab = directory tree
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'christoomey/vim-tmux-navigator'    # C-hjkl across vim + tmux panes
set -g @plugin 'tmux-plugins/tmux-yank'            # y in copy-mode -> OSC 52 -> laptop clipboard
set -g @plugin 'janoamaral/tokyo-night-tmux'       # theme — loads last, owns the status bar
# DIVERGENCE: tmux-battery is dropped. It is a laptop widget; on a CT there is no
# battery to report and the plugin renders an empty slot on every status refresh.

# On an always-on host these stop being crash insurance and become the thing that
# carries a months-old session across an LXC reboot or Proxmox maintenance (#408).
# Verified end-to-end on CT 3003: a full reboot restored both windows and the pane
# scrollback from the last save.
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
# Stated explicitly rather than inherited (the default is also 15). Worth knowing:
# continuum saves off a status-line refresh, and tmux only refreshes the status line
# for an ATTACHED client — so this is "every 15 minutes that someone is connected",
# not a wall-clock timer. Observed on this host before the boot unit was fixed: the
# server ran detached for a full day and wrote zero saves. In practice the state that
# matters (windows, panes, layout, cwd) only changes while you are attached anyway.
# If a detached session ever needs snapshotting, the answer is a systemd timer calling
# tmux-resurrect's save.sh — not a shorter interval here.
set -g @continuum-save-interval '15'

# tokyo-night status bar widgets
# night (#1a1b26, near-black) | storm (#24283b, blue-grey) | moon (#222436) | day (light)
set -g @tokyo-night-tmux_theme storm
set -g @tokyo-night-tmux_window_id_style 'digital'
set -g @tokyo-night-tmux_pane_id_style 'hsquare'
set -g @tokyo-night-tmux_zoom_id_style 'dsquare'
set -g @tokyo-night-tmux_show_datetime 1
set -g @tokyo-night-tmux_date_format 'YMD'
set -g @tokyo-night-tmux_time_format '24H'
set -g @tokyo-night-tmux_show_git 1
set -g @tokyo-night-tmux_show_battery_widget 0     # DIVERGENCE: no battery on a CT
set -g @tokyo-night-tmux_show_path 1
set -g @tokyo-night-tmux_path_format 'relative'

# sidebar: prefix + Tab
set -g @sidebar-tree-command 'tree -C'

run '~/.tmux/plugins/tpm/tpm'

# --- after tpm: graft CPU + prefix-highlight onto the theme's status bar -----
# tokyo-night rebuilds status-right wholesale, so these have to be appended
# once it has finished running.
set -ga status-right '#[fg=#7aa2f7,bg=#1a1b26]  #(~/.tmux/plugins/tmux-cpu/scripts/cpu_percentage.sh) '
set -ga status-left '#{prefix_highlight}'
set -g @prefix_highlight_fg '#1a1b26'
set -g @prefix_highlight_bg '#e0af68'
