# Cloudflared — dedicated Cloudflare Tunnel connector for the DevOps stack.
#
# community-scripts: ct/cloudflared.sh (stable / ProxmoxVE). Deliberately SEPARATE
# from the existing cloudflared CT 2001 (left untouched) — this tunnel only
# fronts DevOps services (e.g. forgejo.chrison.dev → forgejo 3000). Validate
# against ../../Infrastructure/schema/shape.schema.json.

apiVersion: homelab/v1
kind: LXC

metadata:
  name: cloudflared
  stack: DevOps
  tags: [network, cloudflare, tunnel]

spec:
  app: cloudflared
  ctid: 3004
  cores: 1
  memory: 512            # MB
  disk: 2                # GB
  # node/os/network/storage/timezone inherited from the DevOps stack

  # Post-create wiring (converge / BL-010 — ADD-ONLY on Cloudflare, see CLAUDE.md):
  dependsOn: [forgejo]
  config:
    tunnel: Homelab.Stacks.DevOps            # NEW named tunnel — never touches existing tunnels / CT 2001
    ingress:
      - { hostname: forgejo.chrison.dev, service: "http://forgejo:3000" }   # 'forgejo' resolves via dependsOn
  secrets:
    - name: tunnelToken
      valueFrom:
        provider:
          name: cloudflare
          action: tunnel-token               # provisioner creates the tunnel + DNS CNAME (add-only) and returns its token
          auth: { env: CF_API_TOKEN }        # scoped token from secrets.env
