# Forgejo Runner — CI/CD executor for Forgejo Actions.
#
# community-scripts: ct/forgejo-runner.sh — DEV channel only (lives in
# community-scripts/ProxmoxVED, marked "In Development"). We're taking it for a
# test ride. Validate against ../../Infrastructure/schema/shape.schema.json.

apiVersion: homelab/v1
kind: LXC

metadata:
  name: forgejo-runner
  stack: DevOps
  tags: [ci, forge]

spec:
  app: forgejo-runner
  source:
    channel: dev         # → community-scripts/ProxmoxVED (overrides stack default 'stable')
    # ref: <pin a SHA here for reproducibility once the script stabilises>
  ctid: 3001
  cores: 4               # build muscle (overrides script default 2)
  memory: 4096           # MB
  disk: 16               # GB
  features:
    nesting: true        # runners typically need to run containers
  # node/os/network/storage/timezone inherited from the DevOps stack

  # Post-create wiring (converge / BL-010):
  dependsOn: [forgejo]                       # order after forgejo; its URL is resolved for registration
  config:
    runnerLabels: [homelab]
  secrets:
    - name: runnerToken
      valueFrom:
        service: { ref: forgejo, action: generate-runner-token }   # derived from Forgejo at provision time
