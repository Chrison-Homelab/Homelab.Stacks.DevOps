# GitHub Runner — self-hosted runner offered to GitHub projects.
#
# community-scripts: ct/github-runner.sh (stable / ProxmoxVE). This is a NEW,
# independent runner — the existing CT 2005 is intentionally LEFT UNTOUCHED and
# unmanaged by IaC. Validate against ../../Infrastructure/schema/shape.schema.json.

apiVersion: homelab/v1
kind: LXC

metadata:
  name: github-runner
  stack: DevOps
  tags: [ci, github]

spec:
  app: github-runner
  ctid: 3002
  cores: 4               # build muscle (overrides script default 2)
  memory: 4096           # MB
  disk: 16               # GB
  features:
    nesting: true        # builds often need Docker
  # node/os/network/storage/timezone inherited from the DevOps stack

  # Post-create wiring (converge / BL-010):
  config:
    githubOrg: Chrison-dev
  secrets:
    - name: registrationToken
      valueFrom:
        provider:
          name: github
          action: org-runner-token
          with: { org: Chrison-dev }
          auth: { env: GH_RUNNER_PAT }       # PAT resolved from secrets.env
